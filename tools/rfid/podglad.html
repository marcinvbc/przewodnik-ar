<!DOCTYPE html><html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "../../lib/three/build/three.module.min.js", "three/addons/": "../../lib/three/examples/jsm/" } }</script></head>
<body style="margin:0;background:#eef0f2">
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFExporter } from "../burgery/GLTFExporter.js";
import { MODELE as M0, rozloz, duch } from "../../lekcje/rfid/modele.js";
import { ukladLab } from "../../lekcje/rfid/uklad.js";
const MODELE = { ...M0, ukladEtap1: () => ukladLab(1, { etykiety: false }).grupa, ukladEtap2: () => ukladLab(2, { etykiety: false }).grupa, ukladWzorzec: () => { const u = ukladLab(2, { etykiety: false }); u.grupa.children.forEach(c => { if (!c.userData.polaczenie && !u.polaczenia.some(p => p.znaczniki === c)) duch(c); }); u.polaczenia.forEach(p => { p.obj.material.transparent = true; p.obj.material.opacity = 0.75; u.grupa.remove(p.znaczniki); }); u.grupa.name = "Układ RFID – wzorzec"; return u.grupa; } };
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(900, 650); r.toneMapping = THREE.NeutralToneMapping; document.body.append(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color("#eef0f2"); sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const d = new THREE.DirectionalLight("#fff", 1.2); d.position.set(1, 3, 2); sc.add(d);
let obj = null;
window.pokaz = (nazwa, t = 0, kat = 0.6, wys = 0.55, odl = 1.25) => {
  if (obj) sc.remove(obj); obj = MODELE[nazwa](); if (nazwa === "bramkaUHF") { const p = MODELE.paleta(); p.position.set(0, 0, 0.2); obj.add(p); }
  rozloz(obj, t); sc.add(obj); obj.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(obj), c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3()).length();
  const cam = new THREE.PerspectiveCamera(30, 900 / 650, s / 100, s * 20); cam.position.set(c.x + s * odl * Math.sin(kat), c.y + s * wys, c.z + s * odl * Math.cos(kat)); cam.lookAt(c); r.render(sc, cam);
  return bb.getSize(new THREE.Vector3()).toArray().map(v => +(v * 1000).toFixed(1));
};
window.eksport = async nazwa => { const o = MODELE[nazwa](); if (nazwa === "bramkaUHF") { const p = MODELE.paleta(); p.position.set(0, 0, 0.2); o.add(p); } const buf = await new GLTFExporter().parseAsync(o, { binary: true, maxTextureSize: 1024 }); let s = ""; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 32768) s += String.fromCharCode(...b.subarray(i, i + 32768)); return btoa(s); };
window.gotowe = true;
</script></body></html>
