<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lekcje w e-peAR · Lekcja AR</title>
<link rel="stylesheet" href="../lekcje/styl.css">
<script src="../lekcje/konfiguracja.js"></script>
<script src="../wersja.js"></script>
<script type="importmap">{ "imports": { "three": "../lib/three/build/three.module.min.js", "three/addons/": "../lib/three/examples/jsm/" } }</script>
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  #uklad { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr); }
  #lista { border-right: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; min-height: 0; }
  #lista .szuk { padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  #kursy { overflow: auto; flex: 1; }
  .kurs { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 12px; cursor: pointer; font: inherit; color: inherit; }
  .kurs:hover { background: #faf6ec; } .kurs.wyb { background: #fff1e6; box-shadow: inset 4px 0 0 var(--accent); }
  .kurs b { display: block; font-size: 14px; } .kurs .ik { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .st { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: #eef1f4; color: #4c5b68; margin-right: 4px; } .st.mob { background: #eef6ef; color: var(--ok); } .st.pub { background: #fff3d6; color: #7a5a00; }
  #szczeg { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  #naglowek { padding: 12px 16px 0; background: var(--card); border-bottom: 1px solid var(--line); }
  #naglowek h1 { font-size: 21px; } #zakladki { display: flex; gap: 2px; margin-top: 10px; flex-wrap: wrap; }
  #zakladki button { border: 0; background: none; padding: 8px 12px; font: 600 14px system-ui; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; } #zakladki button.wyb { color: var(--ink); border-color: var(--accent); }
  #tresc { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; }
  .scena { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; height: 100%; min-height: 420px; }
  .scena3d { position: relative; background: radial-gradient(120% 100% at 40% 25%, #2b3e4f, #121c25 75%); border-radius: 14px; overflow: hidden; min-height: 380px; }
  .scena3d canvas { width: 100%; height: 100%; display: block; }
  .slajdy { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; gap: 4px; flex-wrap: wrap; z-index: 2; }
  .slajdy button { border: 0; border-radius: 99px; padding: 5px 11px; font: 700 12.5px system-ui; background: #ffffffd9; cursor: pointer; } .slajdy button.wyb { background: var(--accent); color: #fff; }
  .legenda3d { position: absolute; left: 10px; bottom: 10px; color: #d6e2ec; font-size: 12px; background: #0008; border-radius: 10px; padding: 6px 9px; z-index: 2; max-width: 75%; }
  .obiekty { overflow: auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .ob { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; cursor: pointer; font-size: 13px; } .ob.wyb { border-color: var(--accent); box-shadow: 0 0 0 2px #c9562f33; }
  .ob b { font-size: 13.5px; } .ob .poz { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); margin-top: 3px; }
  .chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: #f1ebdd; margin: 3px 3px 0 0; } .chip.on { background: #e3f1e6; color: var(--ok); }
  table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; } table.t th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px; } table.t td { border-bottom: 1px solid #efe9dc; padding: 6px; vertical-align: top; }
  .pyt { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; } .pyt li.ok { color: var(--ok); font-weight: 700; }
  pre.surowe { font: 12px ui-monospace, Menlo, monospace; background: #1f2a2e; color: #e8efe9; border-radius: 12px; padding: 12px; overflow: auto; max-height: 70vh; white-space: pre; }
  .opis { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .pusto2 { display: grid; place-items: center; height: 100%; text-align: center; color: var(--muted); padding: 30px; }
  .drop { border: 2px dashed #d8cfbb; border-radius: 16px; padding: 24px; background: #fffaf0; }
  .drop.nad { border-color: var(--accent); background: #fff1e6; }
  @media (max-width: 980px) { #uklad { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } #lista { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); } .scena { grid-template-columns: 1fr; height: auto; } .scena3d { height: 52vh; } }
  @media (max-width: 640px) { header.top { flex-wrap: wrap; row-gap: 6px; } header.top b { white-space: nowrap; } #info { order: 9; flex-basis: 100%; font-size: 11px; } header.top .btn { font-size: 13px; padding: 7px 10px; } #uklad, #szczeg, .scena, .scena3d { min-width: 0; max-width: 100vw; } body { overflow-x: hidden; } }
</style>
</head>
<body>
<header class="top"><div class="logo">AR</div><b>Lekcje w e-peAR</b><span class="small muted" id="info"></span><span class="sp"></span>
  <button class="btn sm accent" id="bPobierz">📥 Pobierz z e-peAR</button><label class="btn sm" style="cursor:pointer">📂 Wczytaj plik .zip<input type="file" id="plik" accept=".zip" hidden></label>
  <a class="btn sm ghost" href="../lekcje/nauczyciel.html">Panel nauczyciela</a></header>
<div id="uklad">
  <aside id="lista"><div class="szuk"><input type="text" id="szukaj" placeholder="Szukaj lekcji…"><select id="filtr"><option value="">Wszystkie</option><option value="scena">Ze sceną AR</option><option value="awatar">Z awatarem</option><option value="quiz">Z quizem</option><option value="bez">Bez sceny</option></select></div><div id="kursy"></div></aside>
  <section id="szczeg"></section>
</div>
<script type="module" src="lekcje.js?v=54"></script>
</body>
</html>
