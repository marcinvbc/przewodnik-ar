/* ===== gra ===== */
let gra = null;
const OFS_DOTYK = 40;
function startGry(t0) {
  dzwiek("start");
  const sklad = burger.sklad, kaw = sklad.map((k, i) => ({ k, id: "k" + i }));
  if (tryb === "starszak") ZMYLKI.filter(z => !sklad.includes(z)).slice(0, 2).forEach((k, i) => kaw.push({ k, id: "z" + i, zmylka: true }));

  gra = { sklad, krok: 0, kaw, t0, kary: 0, bledy: 0, koniec: null };
  $("#plansza").hidden = false; $("#naglowek").hidden = false; $("#hTytul").textContent = `🍔 ${burger.nazwa}`;

let G = {};
function uklad() {
  if (!gra) return; const W = innerWidth, H = innerHeight, top = ($("#naglowek").offsetHeight || 54) + 8, pion = W < H * 1.05;
  const tacaH = pion ? Math.min(H * 0.38, 330) : H - top - 16, tacaW = pion ? W - 16 : Math.min(W * 0.42, 560);
  const taca = $("#taca"); Object.assign(taca.style, pion ? { left: "8px", right: "8px", top: "", height: tacaH + "px", width: "" } : { left: "", right: "8px", top: top + "px", height: tacaH + "px", width: tacaW + "px" });

  const wysStosu = gra.sklad.reduce((s, k) => s + WYS[k], 0) * PX_CM;
  const szer = Math.min(pole.w * 0.62, (pole.h * 0.92) / ((wysStosu + 150) / SPR), 460), sk = szer / SPR;
  G = { sk, szer, cx: pole.x + pole.w * (pion ? 0.42 : 0.45), baza: pole.y + pole.h * 0.94, pion, taca: taca.getBoundingClientRect() };
  Object.assign($("#talerz").style, { width: szer * 1.25 + "px", height: szer * 0.42 + "px", left: G.cx - szer * 0.625 + "px", top: G.baza - szer * 0.27 + "px" });

function yWarstwy(i) { let y = 0; for (let j = 0; j < i; j++) y += WYS[gra.sklad[j]]; return G.baza - Y0 * G.sk - y * PX_CM * G.sk; }

  const c = $("#cel"), yc = yWarstwy(gra.krok) + Y0 * G.sk; Object.assign(c.style, { left: G.cx - G.szer * 0.42 + "px", top: yc - G.szer * 0.16 + "px", width: G.szer * 0.84 + "px", height: G.szer * 0.3 + "px" });

function podpowiedz() { if (!gra) return; const nast = gra.sklad[gra.krok]; let jeden = false; for (const kw of gra.kaw) { const p = tryb === "maluch" && !kw.uzyty && kw.k === nast && !jeden; if (p) jeden = true; kw.dom?.classList.toggle("podpowiedz", p); } }
